name: pair_quest
description: "Memoko - Memory Card Matching Game"
publish_to: 'none'
version: 2.3.0+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  shared_preferences: ^2.3.5

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.1.6

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7

  # UI
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Confetti Animation
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5

  # App Icon Generator
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.1.0

flutter_launcher_icons:
  # Memoko icon. Sources and generator: docs/icon/ (make_icon_assets.py).
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "docs/icon/app_icon.png"
  image_path_ios: "docs/icon/app_icon_ios.png"
  image_path_ios_dark_transparent: "docs/icon/app_icon_ios_dark.png"
  image_path_ios_tinted_grayscale: "docs/icon/app_icon_ios_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  adaptive_icon_background: "docs/icon/adaptive_background.png"
  adaptive_icon_foreground: "docs/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "docs/icon/adaptive_monochrome.png"
  web:
    generate: true
    image_path: "docs/icon/app_icon.png"
  windows:
    generate: true
    image_path: "docs/icon/app_icon.png"
  macos:
    generate: true
    image_path: "docs/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/themes/
    - assets/images/themes/animals/
    - assets/images/card_backs/
    - assets/sounds/
    - assets/music/
